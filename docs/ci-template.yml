name: Maestro v2.0 CI & Anti-Leak Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies (Pydantic for Open WebUI Pipe)
        run: pip install pydantic

      - name: Run Maestro v2.0 Automated Test Suite
        run: python3 tests/test_maestro_v2.py

      - name: Run CLI Benchmark Suite
        run: python3 src/maestro_cli.py --benchmark

      - name: Strict Sanitization & Anti-Leak Scan
        run: |
          if grep -rnE "(192\.168\.[0-9]+\.[0-9]+|100\.[0-9]+\.[0-9]+\.[0-9]+|\bghp_[a-zA-Z0-9]{20,}\b|\bsk-[a-zA-Z0-9]{20,}\b)" README.md docs/ src/ tests/; then
            echo "❌ ERRO CRÍTICO: IP privado ou token detectado!"
            exit 1
          fi
          echo "✅ Varredura de sanitização 100% limpa."

